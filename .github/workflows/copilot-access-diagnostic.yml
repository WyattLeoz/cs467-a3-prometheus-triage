# Temporary diagnostic (no model call, no writes): what can COPILOT_GITHUB_TOKEN do?
# Prints the token owner's Copilot plan/org info and the model catalog with each model's
# policy state for the agentic-workflows integration. Never prints the token.
name: Copilot access diagnostic
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions: {}
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[diag]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect token, plan and model catalog
        env:
          T: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          exec > >(tee /tmp/diag.txt) 2>&1
          h=(-sS -H "Authorization: Bearer $T" -H "Accept: application/json")
          echo "== token owner"; curl "${h[@]}" https://api.github.com/user | jq '{login, type}'
          echo "== Copilot seat (copilot_internal/user)"
          curl "${h[@]}" https://api.github.com/copilot_internal/user | jq 'del(.analytics_tracking_id, .endpoints?) | {copilot_plan, access_type_sku, chat_enabled, is_mcp_enabled, organization_login_list, organization_list: [.organization_list[]?.login], restricted_telemetry, can_signup_for_limited, quota_snapshots: (.quota_snapshots // {} | with_entries(.value |= {entitlement, remaining, unlimited, overage_permitted}))}' || true
          echo "== models visible to integration agentic-workflows"
          curl "${h[@]}" -H "Copilot-Integration-Id: agentic-workflows" -H "Editor-Version: gh-aw/0.93.1" https://api.githubcopilot.com/models \
            | jq -r '.data[] | [.id, (.policy.state // "-"), (.model_picker_enabled|tostring), ((.supported_endpoints // []) | join("+")), (.billing.is_premium|tostring), (.billing.multiplier|tostring)] | @tsv' | sort | column -t || true
          echo "== minimal probe per enabled model on its native endpoint"
          probe() { code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $T" -H "Copilot-Integration-Id: agentic-workflows" -H "Content-Type: application/json" "https://api.githubcopilot.com$1" -d "$2"); echo "$3 $1 -> HTTP $code $(jq -c '.error // empty' /tmp/r.json 2>/dev/null | head -c 160)"; }
          for m in gpt-6-luna gpt-5.6-luna mai-code-1.1-flash gpt-5.6-luna-free-auto; do
            probe /responses "{\"model\":\"$m\",\"input\":\"hi\",\"max_output_tokens\":16}" "$m"
          done
          probe /v1/messages '{"model":"claude-haiku-4.5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' claude-haiku-4.5
          probe /chat/completions '{"model":"gpt-4.1","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' gpt-4.1
      - name: Publish findings as annotations (readable via the check-runs API)
        if: always()
        run: |
          split -l 40 /tmp/diag.txt /tmp/part_
          for f in /tmp/part_*; do echo "::notice title=diag $(basename $f)::$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"; done
