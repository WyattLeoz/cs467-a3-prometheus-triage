# Audit trail for the triage agent (deterministic, no model).
# After every "Prometheus Issue Triage" run, store the `gh aw audit` report
# (trigger, model, tool calls, firewall decisions, safe outputs, token cost) on the
# `audit-log` branch, so the record outlives the 90-day Actions log retention and
# every change to it is a git commit.
name: Triage audit archive

on:
  workflow_run:
    workflows: ["Prometheus Issue Triage", "Safe-output limits test"]
    types: [completed]
  workflow_dispatch:  # backfill: archive one run that has no audits/*-run<id>/ directory
    inputs:
      run_id:
        description: "Run ID of a completed triage or limits-test run to archive"
        required: true

permissions:
  actions: read    # download the triage run's logs and artifacts
  contents: write  # push to the audit-log branch only
  issues: write    # open a [drift] alert issue (GITHUB_TOKEN issues do not trigger the agent)

# One archive at a time (they push to the same branch). queue: max keeps up to 100 pending
# archives instead of the default one, so a burst of completions does not drop records.
concurrency:
  group: triage-audit-archive
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit-log branch (create if missing)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Archive gh aw audit report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be numeric"; exit 1; }
          if [ -z "$RUN_CONCLUSION" ]; then  # backfill: read the run's own event and result
            RUN_EVENT=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json event -q .event)
            RUN_CONCLUSION=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin audit-log >/dev/null; then
            git fetch --depth 1 origin audit-log && git checkout audit-log
          else
            git checkout --orphan audit-log && git rm -rq --cached . && git clean -fdq
            echo "# Triage agent audit log (written by triage-audit-archive.yml)" > README.md
          fi
          if ls -d audits/*-run"$RUN_ID" >/dev/null 2>&1; then echo "run $RUN_ID already archived"; exit 0; fi
          gh extension install github/gh-aw --pin v0.93.1
          dir="audits/$(date -u +%Y-%m-%d)-run$RUN_ID"
          mkdir -p "$dir" /tmp/audit
          # Never commit a partial archive: an existing directory is treated as complete (skip above), so a
          # failed audit must fail this job and leave nothing behind; re-run or backfill it later.
          if ! gh aw audit "$RUN_ID" --repo "$GITHUB_REPOSITORY" --parse --no-baseline -o /tmp/audit > "$dir/report.md" 2>&1 \
             || ! gh aw audit "$RUN_ID" --repo "$GITHUB_REPOSITORY" --no-baseline -o /tmp/audit --json > "$dir/report.json" \
             || ! jq -e --argjson id "$RUN_ID" '.overview.run_id == $id' "$dir/report.json" >/dev/null; then
            echo "::error::audit of run $RUN_ID failed or is incomplete; nothing archived. Backfill: gh workflow run triage-audit-archive.yml -f run_id=$RUN_ID"
            exit 1
          fi
          # Keep the human-readable parsed logs and small JSON/Markdown evidence; skip large raw dumps.
          find /tmp/audit -type f \( -name '*.md' -o -name '*.json' -o -name '*.jsonl' -o -name '*.txt' \) -size -2M \
            -exec sh -c 'for f; do rel="${f#/tmp/audit/}"; mkdir -p "$0/$(dirname "$rel")"; cp "$f" "$0/$rel"; done' "$dir" {} +
          printf 'run_id: %s\nevent: %s\nconclusion: %s\narchived_at: %s\n' "$RUN_ID" "$RUN_EVENT" "$RUN_CONCLUSION" "$(date -u +%FT%TZ)" > "$dir/meta.txt"
          git add -A
          git commit -qm "audit: triage run $RUN_ID ($RUN_CONCLUSION)"
          git push origin HEAD:audit-log
      # Drift detection: compare the served model snapshot and Copilot CLI version recorded in this
      # run's audit with the reviewed baseline on main; open one alert issue per distinct change.
      - name: Alert on model or CLI drift
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          report=$(ls -d audits/*-run"$RUN_ID")/report.json
          served=$(jq -r '[(.firewall_token_usage.by_model // {}) | keys[] | select(test("-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | first // empty' "$report")
          cli=$(jq -r '.engine_config.version // empty' "$report")
          if [ -z "$served" ] && [ -z "$cli" ]; then echo "no model call in this run"; exit 0; fi
          base=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/agent-baseline.json" -H "Accept: application/vnd.github.raw")
          want_model=$(jq -r .served_model <<<"$base"); want_cli=$(jq -r .copilot_cli <<<"$base")
          change=""
          if [ -n "$served" ] && [ "$served" != "$want_model" ]; then change="model $want_model -> $served"; fi
          if [ -n "$cli" ] && [ "$cli" != "$want_cli" ]; then change="${change:+$change, }Copilot CLI $want_cli -> $cli"; fi
          if [ -z "$change" ]; then echo "no drift (model $served, CLI $cli)"; exit 0; fi
          title="[drift] triage agent: $change"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "alert already open: $title"; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Run $RUN_ID (audit: \`audits/$(basename "$(dirname "$report")")\` on the \`audit-log\` branch) ran on $change. Rerun the golden set (\`evals/golden/README.md\`), compare \`summary.md\` with the last run, then update \`.github/agent-baseline.json\` or disable the workflow."

